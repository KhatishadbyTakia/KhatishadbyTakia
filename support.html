<!DOCTYPE html>
<html lang="bn">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>Support | Khati Shad by Takia</title>


    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


    <!-- Font Awesome -->

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">


    <!-- Support CSS -->

    <link rel="stylesheet" href="support.css">


</head>



<body>


<!-- Navbar -->

<nav class="navbar navbar-dark bg-success shadow-sm">


    <div class="container">


        <a href="index.html" class="navbar-brand fw-bold">


            <i class="fa-solid fa-arrow-left"></i>


            Khati Shad by Takia


        </a>


    </div>


</nav>





<!-- Chat Section -->


<section class="chat-section">


<div class="container">


<div class="chat-box shadow">



<!-- Header -->


<div class="chat-header">


    <div class="bot-img">


        <i class="fa-solid fa-headset"></i>


    </div>



    <div>


        <h5>
            AI Support Bot
        </h5>


        <small class="text-success">

            ● Online

        </small>


    </div>



</div>








<!-- Messages -->


<div class="chat-body" id="chatBody">


    <!-- এখানে কিছু লিখবেন না -->

    <!-- support.js নিজে welcome message দিবে -->


</div>









<!-- Quick Buttons -->


<div class="quick-buttons">



<button class="btn btn-outline-success btn-sm quick">

🍯 মধুর দাম

</button>



<button class="btn btn-outline-success btn-sm quick">

🧈 ঘির দাম

</button>




<button class="btn btn-outline-success btn-sm quick">

🚚 ডেলিভারি

</button>





<button class="btn btn-outline-success btn-sm quick">

🛒 সব পণ্য

</button>



</div>









<!-- Input -->


<div class="chat-input">



<input

type="text"

id="userInput"

class="form-control"

placeholder="আপনার প্রশ্ন লিখুন..."

>




<button

class="btn btn-success"

id="sendBtn">


<i class="fa-solid fa-paper-plane"></i>


</button>



</div>





</div>


</div>


</section>









<!-- JS FILE -->


<script src="./products-data.js"></script>

<script src="./support.js"></script>



</body>


</html>
