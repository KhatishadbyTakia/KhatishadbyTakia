<section class="py-5 bg-light">

<div class="container text-center">

<h1 class="text-success">

Checkout

</h1>

<p>

আপনার তথ্য দিয়ে অর্ডার সম্পন্ন করুন

</p>

</div>

</section>

<section class="container py-5">

<div class="row">

<div class="col-lg-7">

<div class="card shadow">

<div class="card-body">

<h4 class="mb-4">

গ্রাহকের তথ্য

</h4>

<form>

<div class="mb-3">

<label class="form-label">

পূর্ণ নাম

</label>

<input type="text"
id="customerName"
class="form-control"
placeholder="আপনার নাম">

</div>

<div class="mb-3">

<label class="form-label">

মোবাইল নম্বর

</label>

<input type="tel"
id="customerPhone"
class="form-control"
placeholder="01XXXXXXXXX">

</div>

<div class="mb-3">

<label class="form-label">

সম্পূর্ণ ঠিকানা

</label>

<textarea
id="customerAddress"
class="form-control"
rows="4"
placeholder="আপনার ঠিকানা লিখুন"></textarea>

</div>

<div class="mb-3">

<label class="form-label">

অতিরিক্ত তথ্য (ঐচ্ছিক)

</label>

<textarea
id="customerNote"
class="form-control"
rows="3"></textarea>

</div>
<!-- Payment Method -->

<div class="mb-3">

<label class="form-label">
পেমেন্ট পদ্ধতি
</label>


<select id="paymentMethod" class="form-control">

<option value="Cash on Delivery">
Cash on Delivery
</option>


<option value="bKash">
bKash Payment
</option>


</select>

</div>


<!-- bKash Payment -->

<div class="mb-3 alert alert-success">

<h6>
bKash Payment
</h6>


<p>
bKash Number:
<b>01791649266</b>
</p>


<p>
Send Money করার পর Transaction ID দিন
</p>


<input 
type="text"
id="trxId"
class="form-control"
placeholder="Transaction ID">

</div>
<button
type="button"
class="btn btn-success btn-lg w-100"
onclick="whatsappOrder()">

<i class="fab fa-whatsapp"></i>

WhatsApp-এ অর্ডার নিশ্চিত করুন

</button>

</form>

</div>

</div>

</div>

<div class="col-lg-5">

<div class="card shadow">

<div class="card-body">

<h4>

অর্ডার সারাংশ

</h4>

<hr>

<p>

সাবটোটাল

<span id="subTotal"
class="float-end">

৳0

</span>

</p>

<p>

ডেলিভারি চার্জ

<span id="deliveryCharge"
class="float-end">

৳150

</span>

</p>

<hr>

<h4>

মোট

<span id="grandTotal"
class="float-end text-success">

৳0

</span>

</h4>

</div>

</div>

</div>

</div>
