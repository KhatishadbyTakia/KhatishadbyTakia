<!DOCTYPE html>
<html lang="bn">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Category | Khati Shad by Takia</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Your CSS -->
    <link rel="stylesheet" href="./category.css">

</head>

<body>



<!--==================== HEADER ====================-->

<header>

<nav class="navbar navbar-dark bg-success sticky-top">
    <div class="container d-flex align-items-center">

        <!-- Logo + Website Name -->
        <a class="navbar-brand fw-bold d-flex align-items-center me-4" href="#">
            <img src="images/logo 2.png" width="55" class="me-2" alt="Logo">
            <span class="text-white">Khati Shad by Takia</span>
        </a>

        <!-- Menu -->
        <ul class="navbar-nav flex-row">
            <li class="nav-item">
                <a class="nav-link px-3 active" href="index.html">হোম</a>
            </li>

            <li class="nav-item">
                <a class="nav-link px-3" href="products.html">পণ্য</a>
            </li>

            <li class="nav-item">
                <a class="nav-link px-3 position-relative" href="cart.html">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span id="cartCount"
                        class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-warning text-dark">
                        0
                    </span>
                </a>
            </li>
        </ul>

    </div>
</nav>

</header>





<!--==================== PAGE TITLE ====================-->

<section class="py-5 bg-light">

    <div class="container text-center">

        <h2 id="categoryTitle">

            Category

        </h2>

        <p class="text-muted mb-0">

            খাঁটি ও নিরাপদ খাদ্যপণ্য

        </p>

    </div>

</section>






<!--==================== SEARCH ====================-->

<section class="py-4">

<div class="container">

<div class="row justify-content-center">

<div class="col-lg-6">

<div class="search-box">

<i class="fa-solid fa-magnifying-glass"></i>

<input

type="text"

id="searchInput"

class="form-control"

placeholder="পণ্যের নাম লিখে খুঁজুন..."

onkeyup="searchProduct()"

>

</div>

</div>

</div>

</div>

</section>







<!--==================== PRODUCTS ====================-->

<section class="pb-5">

<div class="container">

<div

class="row g-4"

id="productContainer"

>

</div>

</div>

</section>







<!--==================== TOAST ====================-->

<div

class="toast-container position-fixed bottom-0 end-0 p-3">

<div

id="cartToast"

class="toast"

role="alert">

<div class="toast-body">

<span id="toastText"></span>

</div>

</div>

</div>







<!-- Bootstrap -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- আপনার বর্তমান app.js -->

<script src="./products-data.js"></script>
<script src="./app.js"></script>
<script src="./category.js"></script>

</body>

</html>
